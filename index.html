<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ===== EDIT THIS: your game name appears in the browser tab ===== -->
<title>Team Racket</title>
<meta name="description" content="Team Racket — a VR game on Meta Quest.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =========================================================
     COLOR THEME — change these two lines to re-skin the site
     ========================================================= */
  :root{
    --accent:   #5eead4;   /* primary glow / button colour */
    --accent-2: #ff7a59;   /* secondary highlight colour     */
    --bg:       #06070d;
    --ink:      #eef1f7;
    --muted:    #8b93a7;
    --card:     rgba(255,255,255,.04);
    --line:     rgba(255,255,255,.10);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* layered nebula glow background */
  body::before{
    content:"";
    position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(40% 50% at 20% 18%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 70%),
      radial-gradient(45% 55% at 82% 30%, color-mix(in srgb,var(--accent-2) 18%,transparent), transparent 72%),
      radial-gradient(60% 60% at 50% 100%, color-mix(in srgb,var(--accent) 12%,transparent), transparent 70%);
    animation:drift 22s ease-in-out infinite alternate;
  }
  /* fine starfield */
  body::after{
    content:"";
    position:fixed;inset:0;z-index:-1;
    background-image:
      radial-gradient(1px 1px at 12% 22%, #fff, transparent),
      radial-gradient(1px 1px at 38% 64%, #fff, transparent),
      radial-gradient(1px 1px at 67% 18%, #fff, transparent),
      radial-gradient(1px 1px at 84% 78%, #fff, transparent),
      radial-gradient(1px 1px at 52% 42%, #fff, transparent),
      radial-gradient(1px 1px at 28% 88%, #fff, transparent),
      radial-gradient(1px 1px at 92% 48%, #fff, transparent);
    opacity:.35;
  }
  @keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1.05)}to{transform:translate3d(2%,1%,0) scale(1.12)}}

  .wrap{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:clamp(24px,6vw,72px);
    gap:26px;
  }

  .eyebrow{
    font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--accent);
    padding:7px 16px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);backdrop-filter:blur(6px);
    opacity:0;animation:rise .8s .1s ease forwards;
  }

  h1{
    font-family:"Syne",sans-serif;font-weight:800;
    font-size:clamp(2.8rem,11vw,6.5rem);
    line-height:.95;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff 30%,var(--muted));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:0;animation:rise .8s .22s ease forwards;
  }

  .tagline{
    max-width:36ch;color:var(--muted);font-size:clamp(1rem,2.6vw,1.2rem);
    opacity:0;animation:rise .8s .34s ease forwards;
  }

  .discord-btn{
    --c:var(--accent);
    display:inline-flex;align-items:center;gap:12px;
    margin-top:8px;
    font-weight:600;font-size:1.05rem;
    color:#07120f;text-decoration:none;
    padding:16px 30px;border-radius:14px;
    background:var(--c);
    box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent);
    transition:transform .25s ease, box-shadow .35s ease;
    opacity:0;animation:rise .8s .46s ease forwards;
  }
  .discord-btn svg{width:24px;height:24px;fill:currentColor}
  .discord-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 16px 40px -8px color-mix(in srgb,var(--c) 70%,transparent);
  }
  .discord-btn:focus-visible{outline:3px solid #fff;outline-offset:3px}

  footer{
    padding:28px 24px;text-align:center;
    border-top:1px solid var(--line);
    color:var(--muted);font-size:.85rem;
    display:flex;flex-direction:column;gap:6px;align-items:center;
  }
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
  footer a:hover{border-color:var(--accent);color:var(--accent)}

  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .eyebrow,h1,.tagline,.discord-btn{transform:translateY(14px)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .eyebrow,h1,.tagline,.discord-btn{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <!-- ===== EDIT THIS small label, or delete the line if you don't want it ===== -->
    <span class="eyebrow">Available on Meta Quest</span>

    <!-- ===== EDIT THIS: your game's name ===== -->
    <h1>Team Racket</h1>

    <!-- ===== EDIT THIS: one-line description of your game ===== -->
    <!-- <p class="tagline">[[A short, punchy tagline for your game goes here.]]</p> -->

    <!-- ===== EDIT THIS: paste your Discord invite link in href="" ===== -->
    <a class="discord-btn" href="https://discord.gg/8g76phHRje" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3c-.2.36-.43.844-.59 1.23a18.27 18.27 0 0 0-5.93 0A12.6 12.6 0 0 0 9.44 3 19.7 19.7 0 0 0 5.68 4.37C2.5 9.06 1.64 13.62 2.07 18.12a19.9 19.9 0 0 0 6.06 3.06c.49-.67.93-1.38 1.3-2.13-.71-.27-1.39-.6-2.03-.99.17-.13.34-.26.5-.4a14.2 14.2 0 0 0 12.2 0c.16.14.33.27.5.4-.64.39-1.32.72-2.03.99.37.75.81 1.46 1.3 2.13a19.86 19.86 0 0 0 6.06-3.06c.5-5.2-.85-9.72-3.6-13.75ZM9.35 15.33c-1.18 0-2.15-1.08-2.15-2.41 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.1 2.15 2.42 0 1.33-.95 2.41-2.15 2.41Zm5.3 0c-1.18 0-2.15-1.08-2.15-2.41 0-1.33.95-2.42 2.15-2.42 1.2 0 2.17 1.1 2.15 2.42 0 1.33-.94 2.41-2.15 2.41Z"/></svg>
      Join our Discord
    </a>
  </main>

  <footer>
    <!-- The privacy policy link is RELATIVE so it works no matter what you name your repo -->
    <a href="privacy-policy.html">Privacy Policy</a>
    <!-- ===== EDIT THIS: studio / your name ===== -->
    <span>© <span id="yr"></span> LucaLlama. All rights reserved.</span>
  </footer>

  <script>document.getElementById('yr').textContent=new Date().getFullYear();</script>
</body>
</html>
